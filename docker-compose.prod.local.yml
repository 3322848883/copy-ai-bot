# 本地生产测试 override（叠加 base + prod）
# 用法：docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.prod.local.yml up -d --build
# 目的：本机无域名/hosts 权限，验证 APP_ENV=prod 完整栈启动 + fail-fast + 核心业务流程
# 差异：端口避开 WSL 占用（8000→8001、8025→8026）、CORS/SMTP 用可过校验的占位值、mailhog 别名
services:
  mailhog:
    networks:
      default:
        aliases:
          - smtp-capture
    ports:
      - "8026:8025"
      - "1026:1025"

  db:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6381:6379"

  api:
    environment:
      # ★ 本地生产测试：强制 prod 以触发 fail-fast 校验（.env 的 dev 会绕过）
      APP_ENV: prod
      DEBUG: "false"
      JWT_SECRET: ${JWT_SECRET:-prod-local-test-secret-0123456789abcdef}
      VAULT_KEY_HEX: ${VAULT_KEY_HEX:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      # 本地生产测试：显式放行本地 web/web-admin 跨源（prod 默认拒绝 localhost，需 CORS_ALLOW_LOCAL_TEST=1）
      CORS_ALLOW_LOCAL_TEST: "1"
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002,http://localhost:3001,http://127.0.0.1:3001
      # SMTP 指向 mailhog 别名（config prod 拒绝 localhost/mailhog，用别名绕过）
      SMTP_HOST: smtp-capture
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@signal-saas.test
      # ★ 上线检查修复（2026-08-18）：binance 官方 dataseed 与 llamarpc 容器内不可达（000/521），
      #   换 publicnode 公共节点（已实测容器内 200）
      BSC_RPC_URL: https://bsc.publicnode.com
      ETH_RPC_URL: https://ethereum-rpc.publicnode.com
      # ★ 上线检查修复：gate.com 容器内被墙，浏览器采集走主机代理中继（scripts/proxy_relay.py）
      BROWSER_PROXY_URL: http://host.docker.internal:17897
    # ★ Linux 服务器必需：host.docker.internal 默认不解析（Docker Desktop 自带，Linux 需 host-gateway）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"

  worker:
    environment:
      APP_ENV: prod
      DEBUG: "false"
      JWT_SECRET: ${JWT_SECRET:-prod-local-test-secret-0123456789abcdef}
      VAULT_KEY_HEX: ${VAULT_KEY_HEX:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CORS_ALLOW_LOCAL_TEST: "1"
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002,http://localhost:3001,http://127.0.0.1:3001
      SMTP_HOST: smtp-capture
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@signal-saas.test
      BSC_RPC_URL: https://bsc.publicnode.com
      ETH_RPC_URL: https://ethereum-rpc.publicnode.com
      BROWSER_PROXY_URL: http://host.docker.internal:17897
    # ★ Linux 服务器必需：host.docker.internal 默认不解析（Docker Desktop 自带，Linux 需 host-gateway）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ★ worker 跑 celery 无 HTTP 服务，禁用继承自 api 镜像的 8000 端口健康探测（否则永远 unhealthy）
    healthcheck:
      disable: true

  beat:
    environment:
      APP_ENV: prod
      DEBUG: "false"
      JWT_SECRET: ${JWT_SECRET:-prod-local-test-secret-0123456789abcdef}
      VAULT_KEY_HEX: ${VAULT_KEY_HEX:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CORS_ALLOW_LOCAL_TEST: "1"
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002,http://localhost:3001,http://127.0.0.1:3001
      SMTP_HOST: smtp-capture
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@signal-saas.test
      BSC_RPC_URL: https://bsc.publicnode.com
      ETH_RPC_URL: https://ethereum-rpc.publicnode.com

  consumer:
    environment:
      APP_ENV: prod
      DEBUG: "false"
      JWT_SECRET: ${JWT_SECRET:-prod-local-test-secret-0123456789abcdef}
      VAULT_KEY_HEX: ${VAULT_KEY_HEX:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CORS_ALLOW_LOCAL_TEST: "1"
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002,http://localhost:3001,http://127.0.0.1:3001
      SMTP_HOST: smtp-capture
      SMTP_PORT: "1025"
      MAIL_FROM: no-reply@signal-saas.test
      BSC_RPC_URL: https://bsc.publicnode.com
      ETH_RPC_URL: https://ethereum-rpc.publicnode.com

  web:
    ports:
      - "3002:3000"
    build:
      context: .
      dockerfile: web-ui/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://127.0.0.1:8001

  web-admin:
    ports:
      - "3001:3001"
    build:
      context: .
      dockerfile: web-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://127.0.0.1:8001

  nginx:
    profiles: ["nginx"]
    ports:
      - "8080:80"

  prometheus:
    profiles: ["monitoring"]

  grafana:
    profiles: ["monitoring"]

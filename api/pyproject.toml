[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-saas-api"
version = "0.1.0"
description = "信号聚合跟单 SaaS 平台（FastAPI 单体后端，决策 B 官方直连）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "celery>=5.3",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "python-jose[cryptography]>=3.3",   # M1 T1.2 JWT
    "web3>=6.15",                        # ★ G09 TRC/BEP/ERC
    "tronpy>=0.4",                       # ★ G09 TRON
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "jinja2>=3.1",                       # mailer 模板
    "aiosmtplib>=3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "aiosqlite>=0.20",   # 测试内存库
]

[tool.setuptools.packages.find]
include = ["api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

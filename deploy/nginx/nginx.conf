# signal-saas 统一入口反代：cookie 同域前提（M6 上线就绪）
# 生产启用 443 TLS；本地/灰度可仅用 80
worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 2m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    upstream api_upstream { server api:8000; }
    upstream web_upstream { server web:3000; }

    server {
        listen 80;
        server_name _;

        # ★ 生产核查修复：默认 80 全部跳转 HTTPS（cookie Secure 依赖 TLS）
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 生产 TLS（证书挂载到 /etc/nginx/certs/fullchain.pem + privkey.pem）
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # API（前台 + 后台）
        location /v1/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /admin/v1/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 实时推送（升级头 + 真实 IP 透传）
        location /ws/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 监控与文档
        location /metrics {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /healthz { proxy_pass http://api_upstream; proxy_set_header Host $host; }
        location /healthz/detailed { proxy_pass http://api_upstream; proxy_set_header Host $host; }
        location /docs { proxy_pass http://api_upstream; proxy_set_header Host $host; }
        location /openapi.json { proxy_pass http://api_upstream; proxy_set_header Host $host; }

        # 前端（Next.js）
        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

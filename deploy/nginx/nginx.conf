# signal-saas 统一入口反代：cookie 同域前提（M6 上线就绪）
# 生产启用 443 TLS；本地/灰度可仅用 80
# 域名占位符 ${SITE_DOMAIN} / ${ADMIN_SUBDOMAIN} 由 docker-compose.prod.yml 的 envsubst 注入
#   SITE_DOMAIN=signal-saas.com  ADMIN_SUBDOMAIN=admin.signal-saas.com
worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 2m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    upstream api_upstream { server api:8000; }
    upstream web_upstream { server web:3000; }
    upstream admin_upstream { server web-admin:3001; }

    # ── 80：任意域名统一跳 HTTPS（cookie Secure 依赖 TLS）──
    server {
        listen 80 default_server;
        server_name _;
        location / { return 301 https://$host$request_uri; }
    }

    # ── 主站 HTTPS（前台 SPA + API + WS + 监控）──
    server {
        listen 443 ssl;
        http2 on;
        server_name ${SITE_DOMAIN};

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # API（前台 + 兼容后台旧路径）
        location /v1/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /admin/v1/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 实时推送（升级头 + 真实 IP 透传）
        location /ws/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 监控与文档
        location /metrics { proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
        location /healthz { proxy_pass http://api_upstream; proxy_set_header Host $host; }
        location /healthz/detailed { proxy_pass http://api_upstream; proxy_set_header Host $host; }
        location /docs { proxy_pass http://api_upstream; proxy_set_header Host $host; }
        location /openapi.json { proxy_pass http://api_upstream; proxy_set_header Host $host; }

        # 前台（Next.js web-ui）
        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── 独立后台子域 HTTPS（web-admin 双 SPA，消除前台/后台同应用结构偏差）──
    server {
        listen 443 ssl;
        http2 on;
        server_name ${ADMIN_SUBDOMAIN};

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 后台专用的 API（后台路径 /admin/v1 + 通用 /v1，同源反代）
        location /admin/v1/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /v1/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 后台 SPA（Next.js web-admin，站内导航无 /admin 前缀）
        location / {
            proxy_pass http://admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
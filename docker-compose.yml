# M6 T6.4：一键部署（api + web + db + redis + celery worker/beat + mailhog）
services:
  # ★ 邮件捕获（SMTP 1025 / Web UI + JSON API 8025），prod 模式注册验证码读取
  mailhog:
    image: mailhog/mailhog:latest
    environment:
      MH_STORAGE: memory
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal_saas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_saas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: ai-api:latest
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DEBUG: "false"
      # ★ 生产密钥 fail-fast：缺失即启动失败（配合 config 校验）
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      VAULT_KEY_HEX: ${VAULT_KEY_HEX:?VAULT_KEY_HEX must be set}
      DATABASE_URL: postgresql+asyncpg://signal:signal@db:5432/signal_saas
      REDIS_URL: redis://redis:6379/0
      # ★ 邮件
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@signal-saas.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # ★ V1 上线白名单：仅 gate（其余 4 家官方适配器后续迭代接入）
      ENABLED_EXCHANGES: ${ENABLED_EXCHANGES:-gate}
      # ★ 链上支付 RPC（生产可换自建/付费节点）
      TRON_RPC_URL: ${TRON_RPC_URL:-https://api.trongrid.io}
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.binance.org}
      ETH_RPC_URL: ${ETH_RPC_URL:-https://eth.llamarpc.com}
      # ★ 真实采集 + 有头(xvfb 虚拟屏)：Gate Akamai 拦截 headless，必须 headful
      SCRAPER_REAL: "1"
      SCRAPER_HEADLESS: "false"
      # ★ 模式2 信号源：已跟单交易员（后台搜索/跟单后同步维护）
      SIGNAL_SESSION_ENABLED: "true"
      SIGNAL_SESSION_HEADLESS: "false"
      SIGNAL_SESSION_DATA_DIR: /app/data/signal_session
      # ★ SIGNAL_FOLLOWER_LEADER_IDS 已移除：留空走 fetch_followed_leaders 自动发现
      #   （旧默认 ["32801","24264"] 为 mock 数据；显式指定时需设 JSON 数组且不能为空串）
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # ★ 登录态持久化（user_data_dir 落盘），重启容器不丢登录
      - ./data/signal_session:/app/data/signal_session
    restart: unless-stopped

  worker:
    build: .
    image: ai-api:latest
    # ★ 2026-08-24 生产事故修复：限并发 + 周期回收。
    #   此前未指定 --concurrency，Celery prefork 默认 = CPU 核数(4)，4 进程可同时跑多个
    #   采集任务(poll_live/scrape_all/refresh/reconcile)，各自持有独立 Playwright 浏览器，
    #   批量任务高峰期多浏览器并存、加载全高，且长驻 worker 内 playwright driver 累积不回收，
    #   最终内存耗尽(available 4MB / swap 全满)整机 swap 抖动、docker 命令全部超时。
    #   --concurrency=2：最多 2 个采集浏览器并存；--max-tasks-per-child=50：每 50 个任务
    #   回收 prefork 子进程，强制释放可能残留的 driver/chromium 进程，从根上杜绝进程堆积。
    command: celery -A api.workers.celery_app:celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    # ★ init 进程回收孤儿 chrome：playwright 拉起失败时 chrome 进程树会孤儿化
    #   （无 init 时永久残留并持有 user_data_dir 的 SingletonLock，跨容器锁死浏览器）
    init: true
    environment:
      APP_ENV: ${APP_ENV:-prod}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      VAULT_KEY_HEX: ${VAULT_KEY_HEX:?VAULT_KEY_HEX must be set}
      DATABASE_URL: postgresql+asyncpg://signal:signal@db:5432/signal_saas
      REDIS_URL: redis://redis:6379/0
      # ★ 邮件（reminder 任务发邮件）
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@signal-saas.com}
      # ★ 链上支付 RPC（payment.poll 轮询）
      TRON_RPC_URL: ${TRON_RPC_URL:-https://api.trongrid.io}
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.binance.org}
      ETH_RPC_URL: ${ETH_RPC_URL:-https://eth.llamarpc.com}
      SCRAPER_REAL: "1"
      SCRAPER_HEADLESS: "false"
      # ★ 2026-08-20：爬虫 profile 持久化到宿主机（原容器内路径，容器重建即丢失
      #   热状态 → bulk/scraper 冷 profile 首访被 Akamai 挑战，refresh/scrape_all
      #   全量失败）。挂载后重启/重建容器保留已预热的会话 cookie。
      SCRAPER_DATA_DIR: /app/data/scraper
      SCRAPER_BULK_DATA_DIR: /app/data/scraper-bulk
      SIGNAL_SESSION_ENABLED: "true"
      SIGNAL_SESSION_HEADLESS: "false"
      SIGNAL_SESSION_DATA_DIR: /app/data/signal_session
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/signal_session:/app/data/signal_session
      - ./data/scraper:/app/data/scraper
      - ./data/scraper-bulk:/app/data/scraper-bulk
    restart: unless-stopped

  beat:
    image: ai-api:latest
    command: celery -A api.workers.celery_app:celery_app beat --loglevel=info
    healthcheck:
      disable: true
    environment:
      APP_ENV: ${APP_ENV:-prod}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      VAULT_KEY_HEX: ${VAULT_KEY_HEX:?VAULT_KEY_HEX must be set}
      DATABASE_URL: postgresql+asyncpg://signal:signal@db:5432/signal_saas
      REDIS_URL: redis://redis:6379/0
      TRON_RPC_URL: ${TRON_RPC_URL:-https://api.trongrid.io}
      BSC_RPC_URL: ${BSC_RPC_URL:-https://bsc-dataseed.binance.org}
      ETH_RPC_URL: ${ETH_RPC_URL:-https://eth.llamarpc.com}
      SCRAPER_REAL: "1"
      SIGNAL_SESSION_ENABLED: "true"
      SIGNAL_SESSION_DATA_DIR: /app/data/signal_session
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/signal_session:/app/data/signal_session
    restart: unless-stopped

  # ★ 实时信号常驻采集：单进程独占 scraper/signal_session，零任务交接空窗。
  poller:
    image: ai-api:latest
    command: python -m api.workers.live_poller
    init: true
    environment:
      APP_ENV: ${APP_ENV:-prod}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      VAULT_KEY_HEX: ${VAULT_KEY_HEX:?VAULT_KEY_HEX must be set}
      DATABASE_URL: postgresql+asyncpg://signal:signal@db:5432/signal_saas
      REDIS_URL: redis://redis:6379/0
      SCRAPER_REAL: "1"
      SCRAPER_HEADLESS: "false"
      SCRAPER_DATA_DIR: /app/data/scraper
      SCRAPER_BULK_DATA_DIR: /app/data/scraper-bulk
      SIGNAL_SESSION_ENABLED: "true"
      SIGNAL_SESSION_HEADLESS: "false"
      SIGNAL_SESSION_DATA_DIR: /app/data/signal_session
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/signal_session:/app/data/signal_session
      - ./data/scraper:/app/data/scraper
      - ./data/scraper-bulk:/app/data/scraper-bulk
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,time,redis; v=redis.Redis.from_url(os.environ['REDIS_URL']).get('signal:poller:heartbeat'); assert v and time.time()-float(v)<30"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ★ 信号事件消费者（独立进程：订阅 Redis signal.new → 派发跟单任务）
  consumer:
    image: ai-api:latest
    command: python -m api.workers.consumer_signal
    healthcheck:
      disable: true
    environment:
      APP_ENV: ${APP_ENV:-prod}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      VAULT_KEY_HEX: ${VAULT_KEY_HEX:?VAULT_KEY_HEX must be set}
      DATABASE_URL: postgresql+asyncpg://signal:signal@db:5432/signal_saas
      REDIS_URL: redis://redis:6379/0
      SCRAPER_REAL: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  # ★ 独立后台 SPA（M5 结构偏差消除：与前台 web-ui 完全隔离，独立镜像/端口）
  web-admin:
    build:
      context: .
      dockerfile: web-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
